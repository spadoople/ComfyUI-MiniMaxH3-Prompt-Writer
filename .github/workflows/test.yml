name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r standalone/requirements.txt

      - name: Install DOM test dependency
        run: npm ci --ignore-scripts

      # unittest includes the local Node frontend wrapper; do not run it twice.
      - name: Run Python and frontend tests
        env:
          PYTHONPATH: tests/ci_stubs
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run Standalone tests
        env:
          PYTHONPATH: standalone:standalone/h3_standalone/compat:.
        run: python -m unittest discover -s standalone/tests -p "test_*.py"

      - name: Run Standalone frontend tests
        run: node --test standalone/tests/frontend.mjs
